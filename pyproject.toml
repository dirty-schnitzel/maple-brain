[project]
name = "maplebrain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless", "mss", "dxcam"]

[project.optional-dependencies]
dev = ["pytest"]
vm = ["cryptography"]   # --window vmware with a VNC password (vnc.py: RFB's DES challenge)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
